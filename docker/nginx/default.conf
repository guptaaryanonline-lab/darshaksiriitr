# Reverse proxy for the Next.js app.
#
# Ships HTTP-only by default so the stack works immediately on a fresh
# EC2 instance. To enable TLS, see docker/nginx/README.md for the certbot
# steps, then uncomment the HTTPS server block below and point it at your
# domain's certificate.

upstream nextjs_app {
  server app:3000;
  keepalive 64;
}

# Compression cuts payload size for HTML/JSON/JS/CSS responses that reach
# clients over the public internet from this single EC2 instance.
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_proxied any;
gzip_types
  text/plain
  text/css
  text/xml
  application/json
  application/javascript
  application/xml+rss
  application/xml
  image/svg+xml;

server {
  listen 80;
  server_name _;

  # Required so certbot's HTTP-01 challenge can be served before TLS exists.
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    proxy_pass http://nextjs_app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;

    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    client_max_body_size 20m;
  }
}

