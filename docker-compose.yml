name: darshak-bhatt

services:
  db:
    image: postgres:16-alpine
    container_name: db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
        reservations:
          memory: 256m
    # Not published to the host on purpose — only reachable from other
    # containers on the internal "backend" network.

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILT_AT: ${BUILT_AT:-unknown}
    image: darshak-bhatt-web:latest
    container_name: app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-app}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      RUN_SEED_ON_BOOT: ${RUN_SEED_ON_BOOT:-false}
    volumes:
      # Uploaded images (from /api/admin/upload) are written to disk here.
      # This volume is what makes uploaded images survive container
      # restarts/rebuilds — without it, uploads would live only in the
      # container's writable layer and vanish on `docker compose up` again.
      - app-uploads:/app/public/uploads
    networks:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(r.status!==200)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1.5g
        reservations:
          memory: 256m

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      # Leave DOMAIN unset for HTTP-only (e.g. IP-only access). Once you
      # have a domain pointed at this server, set both and re-run
      # `docker compose up -d` — HTTPS turns on automatically, no manual
      # nginx edits needed.
      DOMAIN: ${DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/conf:/etc/nginx/conf-templates:ro
      - nginx-conf-active:/etc/nginx/conf.d
      - nginx-certs:/etc/nginx/certs:ro
      - certbot-webroot:/var/www/certbot:ro
      - app-uploads:/var/www/uploads:ro
      - ./docker/nginx-entrypoint.sh:/nginx-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/nginx-entrypoint.sh"]
    networks:
      - frontend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  # Daily compressed database dump into ./backups on the host (kept 14 days).
  # Restore: see "Where the data lives" in docker/README.md.
  db-backup:
    image: postgres:16-alpine
    container_name: db-backup
    restart: unless-stopped
    # Shell-script service: a tiny init forwards the stop signal so restarts
    # take a moment instead of a 10-second forced kill.
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-app}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATABASE: ${POSTGRES_DB:-app}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./docker/db-backup.sh:/db-backup.sh:ro
    entrypoint: ["/bin/sh", "/db-backup.sh"]
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    restart: unless-stopped
    init: true
    depends_on:
      - nginx
    environment:
      DOMAIN: ${DOMAIN:-}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:-}
    volumes:
      - nginx-certs:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
      - ./docker/certbot-entrypoint.sh:/certbot-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/certbot-entrypoint.sh"]
    networks:
      - frontend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Networks and the data volumes below are created once by
# docker/setup-volumes.sh (docker/deploy.sh runs it automatically) and are
# marked `external`, so Docker Compose never creates, replaces or deletes
# them — not on `up`, not on `down`, not even on `docker compose down -v`.
networks:
  # Internet-facing side: nginx, the app, and certbot.
  frontend:
    name: darshak-bhatt-frontend
    external: true
  # Private side: the app, the database and its backup job. Created with
  # --internal, so containers that are only on this network (db, db-backup)
  # have no internet access at all; Postgres also publishes no host port.
  backend:
    name: darshak-bhatt-backend
    external: true

volumes:
  # Precious data — external, survives anything except an explicit
  # `docker volume rm <name>`. Same names as before, so existing data is kept.
  db-data:
    name: darshak-bhatt-db-data
    external: true
  app-uploads:
    name: darshak-bhatt-app-uploads
    external: true
  nginx-certs:
    name: darshak-bhatt-nginx-certs
    external: true
  # Disposable — regenerated automatically.
  certbot-webroot:
    name: darshak-bhatt-certbot-webroot
  nginx-conf-active:
    name: darshak-bhatt-nginx-conf-active
