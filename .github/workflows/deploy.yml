name: Deploy to EC2

# Pushes to main are deployed by the server itself (docker/auto-deploy.sh,
# installed with docker/install-auto-deploy.sh), because the instance's
# security group doesn't allow SSH from GitHub's runners. This workflow is
# kept for manual runs if SSH from GitHub is ever opened.
on:
  workflow_dispatch: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd ~/app
            git fetch origin main
            git reset --hard origin/main
            bash docker/deploy.sh
